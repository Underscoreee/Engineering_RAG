[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-rag"
version = "0.1.0"
description = "An engineering-standard RAG question answering system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch==8.19.2",
    "pydantic>=2.0,<3.0",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
